<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CourseMate</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            max-width: 600px;
            margin: auto;
        }

        .header {
            background-color: #0056D2;
            color: #ffffff;
            font-size: 24px;
            padding: 12px;
            text-align: center;
            font-weight: bold;
        }

        .content {
            font-size: 16px;
            line-height: 1.5;
        }

        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #0056D2;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 20px;
            font-weight: 600;
        }

        .button:hover {
            background-color: #0045AE;
        }

        .footer {
            font-size: 12px;
            color: #999999;
            margin-top: 30px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <header class="header">CourseMate</header>

    <div class="content">
        @Body
    </div>

    <footer class="footer">
        &copy; 2025 CourseMate. All rights reserved.<br/>
        Support: support@coursemate.com
    </footer>
</div>
</body>
</html>
