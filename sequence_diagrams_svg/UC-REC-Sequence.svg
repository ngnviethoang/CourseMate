<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" style="font-family: Arial, sans-serif;">
  <defs>
    <style>
      .title { font-size: 18px; font-weight: bold; fill: #1565c0; }
      .actor { fill: #e3f2fd; stroke: #1565c0; stroke-width: 2; }
      .actor-text { fill: #0d47a1; font-size: 11px; font-weight: bold; }
      .lifeline { stroke: #90caf9; stroke-width: 2; stroke-dasharray: 5,3; }
      .message { stroke: #333; stroke-width: 1.5; fill: none; }
      .message-arrow { fill: #333; }
      .message-text { fill: #333; font-size: 10px; }
      .self-message { stroke: #1565c0; stroke-width: 1.5; fill: none; }
      .return-message { stroke: #4caf50; stroke-width: 1.5; fill: none; stroke-dasharray: 3,2; }
      .return-text { fill: #2e7d32; font-size: 10px; font-style: italic; }
      .activation { fill: #e3f2fd; stroke: #1565c0; stroke-width: 1; opacity: 0.5; }
      .note { fill: #fff9c4; stroke: #f9a825; stroke-width: 1; }
      .note-text { fill: #333; font-size: 9px; }
      .step { fill: #bbdefb; stroke: #1565c0; stroke-width: 1; rx: 3; }
      .step-text { fill: #0d47a1; font-size: 9px; }
    </style>
    <marker id="msg-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="ret-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4caf50"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="25" text-anchor="middle" class="title">BIỂU ĐỒ TUẦN TỰ - HỆ THỐNG GỢI Ý KHÓA HỌC</text>

  <!-- Actors -->
  <!-- Student/User -->
  <g transform="translate(100, 50)">
    <circle cx="30" cy="30" r="20" class="actor"/>
    <line x1="30" y1="50" x2="30" y2="850" class="lifeline"/>
    <rect x="5" y="70" width="50" height="25" rx="3" class="actor"/>
    <text x="30" y="87" text-anchor="middle" class="actor-text">Student</text>
  </g>

  <!-- Client/Frontend -->
  <g transform="translate(280, 50)">
    <circle cx="30" cy="30" r="20" class="actor"/>
    <line x1="30" y1="50" x2="30" y2="850" class="lifeline"/>
    <rect x="5" y="70" width="50" height="25" rx="3" class="actor"/>
    <text x="30" y="87" text-anchor="middle" class="actor-text">Client</text>
  </g>

  <!-- API Controller -->
  <g transform="translate(460, 50)">
    <circle cx="30" cy="30" r="20" class="actor"/>
    <line x1="30" y1="50" x2="30" y2="850" class="lifeline"/>
    <rect x="5" y="70" width="50" height="25" rx="3" class="actor"/>
    <text x="30" y="87" text-anchor="middle" class="actor-text">Controller</text>
  </g>

  <!-- RecommendationService -->
  <g transform="translate(640, 50)">
    <circle cx="30" cy="30" r="20" class="actor"/>
    <line x1="30" y1="50" x2="30" y2="850" class="lifeline"/>
    <rect x="5" y="70" width="60" height="25" rx="3" class="actor"/>
    <text x="35" y="87" text-anchor="middle" class="actor-text">RecService</text>
  </g>

  <!-- SignalCollector -->
  <g transform="translate(820, 50)">
    <circle cx="30" cy="30" r="20" class="actor"/>
    <line x1="30" y1="50" x2="30" y2="850" class="lifeline"/>
    <rect x="5" y="70" width="50" height="25" rx="3" class="actor"/>
    <text x="30" y="87" text-anchor="middle" class="actor-text">Collector</text>
  </g>

  <!-- Scorer -->
  <g transform="translate(1000, 50)">
    <circle cx="30" cy="30" r="20" class="actor"/>
    <line x1="30" y1="50" x2="30" y2="850" class="lifeline"/>
    <rect x="5" y="70" width="50" height="25" rx="3" class="actor"/>
    <text x="30" y="87" text-anchor="middle" class="actor-text">Scorer</text>
  </g>

  <!-- Database -->
  <g transform="translate(1100, 50)">
    <rect x="0" y="20" width="60" height="850" class="actor" fill="#f5f5f5"/>
    <text x="30" y="87" text-anchor="middle" class="actor-text">Database</text>
  </g>

  <!-- Messages -->
  <!-- 1. User clicks Recommendations -->
  <line x1="130" y1="120" x2="310" y2="120" class="message" marker-end="url(#msg-arrow)"/>
  <text x="220" y="115" text-anchor="middle" class="message-text">1. Click "Gợi ý"</text>

  <!-- 2. Client calls API -->
  <line x1="310" y1="150" x2="490" y2="150" class="message" marker-end="url(#msg-arrow)"/>
  <text x="400" y="145" text-anchor="middle" class="message-text">2. GET /api/recommendations</text>

  <!-- 3. Controller calls Handler -->
  <line x1="490" y1="180" x2="670" y2="180" class="message" marker-end="url(#msg-arrow)"/>
  <text x="580" y="175" text-anchor="middle" class="message-text">3. Handle()</text>

  <!-- 4. Extract StudentId -->
  <line x1="490" y1="210" x2="490" y2="230" class="self-message"/>
  <line x1="490" y1="230" x2="510" y2="230" class="self-message"/>
  <line x1="510" y1="230" x2="510" y2="210" class="self-message"/>
  <rect x="510" y="210" width="120" height="30" class="step"/>
  <text x="570" y="229" text-anchor="middle" class="step-text">4. Extract StudentId</text>

  <!-- 5. Call GetRecommendationsAsync -->
  <line x1="670" y1="250" x2="670" y2="270" class="message" marker-end="url(#msg-arrow)"/>
  <text x="720" y="265" class="message-text">5. GetRecommendationsAsync()</text>

  <!-- 6. Call CollectSignalsAsync -->
  <line x1="670" y1="300" x2="850" y2="300" class="message" marker-end="url(#msg-arrow)"/>
  <text x="760" y="295" text-anchor="middle" class="message-text">6. CollectSignalsAsync()</text>

  <!-- 6.1 Query StudentPreference -->
  <line x1="850" y1="330" x2="1130" y2="330" class="message" marker-end="url(#msg-arrow)"/>
  <text x="990" y="325" text-anchor="middle" class="message-text">6.1 SELECT StudentPreference</text>
  <line x1="1130" y1="330" x2="850" y2="350" class="return-message" marker-end="url(#ret-arrow)"/>
  <text x="990" y="375" text-anchor="middle" class="return-text">return preferences</text>

  <!-- 6.2 Query StudentSkillProfile -->
  <line x1="850" y1="380" x2="1130" y2="380" class="message" marker-end="url(#msg-arrow)"/>
  <text x="990" y="375" text-anchor="middle" class="message-text">6.2 SELECT SkillProfile</text>
  <line x1="1130" y1="380" x2="850" y2="400" class="return-message" marker-end="url(#ret-arrow)"/>
  <text x="990" y="425" text-anchor="middle" class="return-text">return profiles</text>

  <!-- 6.3 Query Enrollments -->
  <line x1="850" y1="420" x2="1130" y2="420" class="message" marker-end="url(#msg-arrow)"/>
  <text x="990" y="415" text-anchor="middle" class="message-text">6.3 SELECT Enrollments</text>
  <line x1="1130" y1="420" x2="850" y2="440" class="return-message" marker-end="url(#ret-arrow)"/>
  <text x="990" y="465" text-anchor="middle" class="return-text">return enrolledCourses</text>

  <!-- 6.4 Query similar students -->
  <line x1="850" y1="460" x2="1130" y2="460" class="message" marker-end="url(#msg-arrow)"/>
  <text x="990" y="455" text-anchor="middle" class="message-text">6.4 SELECT similar students</text>
  <line x1="1130" y1="460" x2="850" y2="480" class="return-message" marker-end="url(#ret-arrow)"/>
  <text x="990" y="505" text-anchor="middle" class="return-text">return similarStudents</text>

  <!-- Return StudentSignals -->
  <line x1="850" y1="500" x2="670" y2="500" class="return-message" marker-end="url(#ret-arrow)"/>
  <text x="760" y="495" text-anchor="middle" class="return-text">return StudentSignals</text>

  <!-- 7. Call ScoreCoursesAsync -->
  <line x1="670" y1="520" x2="1030" y2="520" class="message" marker-end="url(#msg-arrow)"/>
  <text x="850" y="515" text-anchor="middle" class="message-text">7. ScoreCoursesAsync()</text>

  <!-- 7.1 Query all courses -->
  <line x1="1030" y1="550" x2="1130" y2="550" class="message" marker-end="url(#msg-arrow)"/>
  <text x="1080" y="545" text-anchor="middle" class="message-text">7.1 SELECT Courses</text>
  <line x1="1130" y1="550" x2="1030" y2="570" class="return-message" marker-end="url(#ret-arrow)"/>
  <text x="1080" y="595" text-anchor="middle" class="return-text">return courses</text>

  <!-- 7.2 Calculate scores -->
  <rect x="1030" y="590" width="140" height="40" class="step"/>
  <text x="1100" y="605" text-anchor="middle" class="step-text">7.2 Calculate Hybrid Scores</text>
  <text x="1100" y="618" text-anchor="middle" font-size="8" fill="#666">Content + Collab + Weakness + Popular</text>

  <!-- 7.3 Save analytics -->
  <line x1="1030" y1="630" x2="1130" y2="630" class="message" marker-end="url(#msg-arrow)"/>
  <text x="1080" y="625" text-anchor="middle" class="message-text">7.3 INSERT Analytics</text>
  <line x1="1130" y1="630" x2="1030" y2="650" class="return-message" marker-end="url(#ret-arrow)"/>
  <text x="1080" y="675" text-anchor="middle" class="return-text">return analyticsId</text>

  <!-- Return ScoredCourses -->
  <line x1="1030" y1="670" x2="670" y2="670" class="return-message" marker-end="url(#ret-arrow)"/>
  <text x="850" y="665" text-anchor="middle" class="return-text">return ScoredCourses[]</text>

  <!-- 8. Map to DTOs -->
  <rect x="620" y="690" width="120" height="30" class="step"/>
  <text x="680" y="709" text-anchor="middle" class="step-text">8. Map to DTOs</text>

  <!-- 9. Log to Database -->
  <line x1="670" y1="720" x2="1130" y2="720" class="message" marker-end="url(#msg-arrow)"/>
  <text x="900" y="715" text-anchor="middle" class="message-text">9. INSERT RecommendationLog</text>

  <!-- Return success -->
  <line x1="1130" y1="720" x2="670" y2="740" class="return-message" marker-end="url(#ret-arrow)"/>

  <!-- 10. Return RecommendationResponseDto -->
  <line x1="670" y1="760" x2="490" y2="760" class="return-message" marker-end="url(#ret-arrow)"/>
  <text x="580" y="755" text-anchor="middle" class="return-text">return RecommendationResponseDto</text>

  <!-- 11. Return JSON to Client -->
  <line x1="490" y1="780" x2="310" y2="780" class="return-message" marker-end="url(#ret-arrow)"/>
  <text x="400" y="775" text-anchor="middle" class="return-text">return JSON</text>

  <!-- 12. Display to User -->
  <line x1="310" y1="800" x2="130" y2="800" class="message" marker-end="url(#msg-arrow)"/>
  <text x="220" y="795" text-anchor="middle" class="message-text">12. Display recommendations</text>

  <!-- Legend -->
  <g transform="translate(50, 900)">
    <rect width="750" height="40" fill="#fafafa" stroke="#ccc" rx="3"/>
    <text x="10" y="18" font-weight="bold" font-size="10" fill="#333">Chú thích:</text>

    <line x1="10" y1="30" x2="60" y2="30" class="message" marker-end="url(#msg-arrow)"/>
    <text x="70" y="35" font-size="9" fill="#333">Tin nhắn đồng bộ</text>

    <line x1="170" y1="30" x2="220" y2="30" class="return-message" marker-end="url(#ret-arrow)"/>
    <text x="230" y="35" font-size="9" fill="#333">Phản hồi</text>

    <line x1="300" y1="30" x2="350" y2="30" class="lifeline"/>
    <text x="360" y="35" font-size="9" fill="#333">Đường đời (Lifeline)</text>

    <rect x="440" y="22" width="50" height="16" class="step"/>
    <text x="500" y="35" font-size="9" fill="#333">Xử lý</text>

    <rect x="560" y="22" width="50" height="16" class="actor"/>
    <text x="620" y="35" font-size="9" fill="#333">Actor/System</text>

    <rect x="680" y="22" width="50" height="16" class="note"/>
    <text x="740" y="35" font-size="9" fill="#333">Ghi chú</text>
  </g>

  <!-- Note -->
  <rect x="150" y="880" width="500" height="20" class="note"/>
  <text x="400" y="894" text-anchor="middle" class="note-text">* Tương tự cho Contests và Exercises (ScoreContestsAsync, ScoreExercisesAsync)</text>
</svg>
