name: Backend Deploy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backend-deploy.yml"
      - "CourseMate.API/**"
      - "CourseMate.Application/**"
      - "CourseMate.Application.Tests/**"
      - "CourseMate.Contracts/**"
      - "CourseMate.Persistent/**"
      - "CourseMate.slnx"
  workflow_dispatch:

env:
  REGISTRY: "ghcr.io"
  IMAGE_NAME: "coursemate-api"

permissions:
  contents: read

jobs:
  docker_build_push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: CourseMate.API/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy (placeholder)
    runs-on: ubuntu-latest
    needs: docker_build_push

    steps:
      - name: Deploy TODO
        run: |
          echo "Docker image pushed successfully."
          echo "TODO: implement deployment step when backend server is ready."
