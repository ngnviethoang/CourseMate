services:
    db:
        container_name: db
        image: pgvector/pgvector:pg16-trixie
        ports:
            - "5432:5432"
        restart: always
        shm_size: 128mb
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: CourseMateV2
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U postgres" ]
            interval: 5s
            timeout: 5s
            retries: 5

    ollama:
        image: ollama/ollama:0.20.5-rocm
        container_name: ollama
        restart: unless-stopped
        ports:
            - "11434:11434"
        volumes:
            - ./docker-volumes/ollama-data:/root/.ollama

    api:
        container_name: api
        build:
            context: .
            dockerfile: ./CourseMate.API/Dockerfile
        ports:
            - "7071:7071"
        environment:
            - ConnectionStrings__CourseMate=Host=db;Port=5432;Database=CourseMateV2;User ID=postgres;Password=postgres;
        volumes:
            - ./etc/uploads:/app/uploads
        depends_on:
            db:
                condition: service_healthy